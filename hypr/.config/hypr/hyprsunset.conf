# Night light (hyprsunset): warmer colors in the evening, normal colors in the morning.
# Change the times here; the quick settings tile switches it by hand in between.
# on-switch tells Quickshell, so the tile follows the schedule.

profile {
    time = 7:00
    identity = true
    on-switch = qs ipc call nightlight refresh
}

profile {
    time = 20:00
    temperature = 4000
    on-switch = qs ipc call nightlight refresh
}

# Night light (hyprsunset): manual only (user's choice). It starts with normal colors; the
# quick settings tile switches the warm colors on and off.
#
# For a schedule instead, add timed profiles, e.g. `time = 20:00` with `temperature = 4000`
# and `time = 7:00` with `identity = true`, each with the on-switch line below (it tells
# Quickshell, so the tile follows the schedule).

profile {
    time = 0:00
    identity = true
    on-switch = qs ipc call nightlight refresh
}

# Idle: dim, lock, screen off, and suspend on battery (user's "balanced" timings).
# Locking goes through Quickshell's lock screen (quickshell/.config/quickshell/lock/).

general {
    lock_cmd = qs ipc call lock lock                                        # loginctl lock-session and the timers below end up here
    before_sleep_cmd = loginctl lock-session                                # lock before suspend, so waking up shows the lock screen
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' # no extra key press to turn the screen on
    inhibit_sleep = 3                                                       # suspend waits until the lock screen is up
}

listener {
    timeout = 240                         # 4 min: dim
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

listener {
    timeout = 300                         # 5 min: lock
    on-timeout = loginctl lock-session
}

listener {
    timeout = 330                         # 5.5 min: screen off
    on-timeout = hyprctl dispatch 'hl.dsp.dpms({ action = "disable" })'
    on-resume = hyprctl dispatch 'hl.dsp.dpms({ action = "enable" })' && brightnessctl -r
}

listener {
    timeout = 900                         # 15 min: suspend, but only on battery
    on-timeout = systemctl suspend
    condition_cmd = test "$(cat /sys/class/power_supply/ACAD/online)" = 0
    condition_retry = 60                  # plugged out while idle: suspend within a minute
}

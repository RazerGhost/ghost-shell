# Paru reads only one config file, and this one replaces /etc/paru.conf, so include the
# system file first to keep its defaults (PgpFetch, Devel, ...), then add to them.
Include = /etc/paru.conf

[options]
# Don't open each AUR package's PKGBUILD and install script for review before building
# (user's choice). Read them yourself (paru -G <pkg>, or the package's page on
# aur.archlinux.org) when installing something unfamiliar: AUR packages are scripts written by
# other users.
SkipReview

# Early KMS: load the AMD iGPU driver inside the initramfs.
# Without this, amdgpu loads after the switch to the real root and takes over the screen from
# the boot framebuffer at the same moment greetd starts, so tuigreet is drawn and then lost
# (black screen at boot). mkinitcpio reads this after /etc/mkinitcpio.conf.
# Rebuild the initramfs after changing it (install.sh does).
MODULES+=(amdgpu)

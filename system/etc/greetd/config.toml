# greetd: starts your session at boot and again after every logout, logged in straight into
# Hyprland, which locks at once (GHOST_AUTOLOGIN: hyprland.lua holds the keybinds back until
# the shell's lock screen is up; lock/Lock.qml). There is no separate login screen (user's
# choice, 2026-11-04): the disk isn't encrypted and you're the only user, so it protected
# nothing more than the lock screen does. The system module installs this file, filling in
# your user name.
#
# Recovery: if the session can't start (it would start again and again), Ctrl+Alt+F2 gives a
# text login; from there `sudo systemctl stop greetd` stops the loop while you fix it.

[terminal]
vt = 1

[default_session]
# After a logout. greetd runs this slot as a greeter session (logind's Class=greeter), so it's
# only used then; the boot uses initial_session below, a normal user session.
# GREETD_SOCK is left out: it would let any of your programs talk to greetd as the greeter.
# Hyprland's output goes to the journal (journalctl -t hyprland), not onto tty1.
command = "env -u GREETD_SOCK GHOST_AUTOLOGIN=1 systemd-cat --identifier=hyprland start-hyprland"
user = "@USER@"

# Boot: the same session, once per boot, as a user session.
[initial_session]
command = "env -u GREETD_SOCK GHOST_AUTOLOGIN=1 systemd-cat --identifier=hyprland start-hyprland"
user = "@USER@"

# greetd: login manager. Shows a greeter on tty1 at boot; after login it runs Hyprland.
# The system module installs this file; the core module's greeter.sh sets up the greeter.
#
# The greeter is Quickshell's login screen inside a small Hyprland (/etc/greetd/hypr/), run as
# the "greeter" user with /var/lib/qs-greeter as its home (copies of your colors and wallpaper).

[terminal]
vt = 1

[default_session]
# Its Hyprland's output goes to the journal (journalctl -t greeter-hyprland), not onto tty1.
command = "env HOME=/var/lib/qs-greeter systemd-cat --identifier=greeter-hyprland start-hyprland -- --config /etc/greetd/hypr/hyprland.lua"
# Fallback text greeter, if the Quickshell one ever breaks (see "Login screen recovery" in
# ROADMAP.md): swap the comment on these two lines, then sudo systemctl restart greetd.
# command = "tuigreet --time --remember --asterisks --cmd start-hyprland"
user = "greeter"

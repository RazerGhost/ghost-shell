# The HP Omen 16-xf0's bass speakers (see /usr/lib/firmware/ghost-hp-8bca-speakers.fw): the patch
# for every HDA card, in the order they're probed; its [codec] line picks the right one. Four:
# the AMD chip's HDMI, the RTX's HDMI when the RTX is on the bus (it then comes before the
# speakers' codec, which with two entries got none), the speakers' ALC245, and one spare.
options snd-hda-intel patch=ghost-hp-8bca-speakers.fw,ghost-hp-8bca-speakers.fw,ghost-hp-8bca-speakers.fw,ghost-hp-8bca-speakers.fw

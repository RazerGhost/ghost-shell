# Let the RTX power down when nothing uses it (fine-grained runtime power management). The
# driver's default (3) left it "Disabled by default" on this laptop, so it never slept
# (/proc/driver/nvidia/gpus/*/power, 2026-10-29). Installed by modules/system/setup.sh.
options nvidia NVreg_DynamicPowerManagement=0x02

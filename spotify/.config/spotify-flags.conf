# Flags for Spotify, one per line; the AUR package's launcher (/usr/bin/spotify) reads this file.
# Run natively on Wayland instead of through XWayland (sharp at any scale). If Spotify misbehaves
# on Wayland, delete these two lines to go back to XWayland.
--enable-features=UseOzonePlatform
--ozone-platform=wayland

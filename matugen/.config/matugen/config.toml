# matugen: generates Material colors from the wallpaper and writes them through the templates below.
# This is the single source of truth for colors in Quickshell, Hyprland, Ghostty, GTK, Yazi,
# Spotify (the Ghost Spicetify theme), Discord (the Ghost Vencord plugin in Vesktop), MangoHud,
# Zed, Steam (Millennium's Material-Theme) and Zen.
#
# Run through wallpaper.sh (light or dark from the shell): matugen image <wallpaper> -m dark --source-color-index 0
# (--source-color-index 0 skips the interactive prompt when an image yields several source colors)
#
# Templates use matugen's syntax: {{colors.<name>.default.<format>}}, loops with <* for ... *>.
# Relative input_path values resolve against this file's directory.

[config]

[templates.quickshell]
input_path  = 'templates/quickshell-colors.json'
# Outside ~/.config/quickshell on purpose: Quickshell reloads the whole shell when files in its
# config directory change. Colors.qml watches this file and updates colors live instead.
output_path = '~/.local/state/quickshell/colors.json'

[templates.hyprland]
input_path  = 'templates/hyprland-colors.lua'
output_path = '~/.config/hypr/colors.lua'
post_hook   = 'hyprctl reload'

[templates.ghostty]
input_path  = 'templates/ghostty'
output_path = '~/.config/ghostty/themes/Matugen'
# SIGUSR2 makes running Ghostty windows reload their config.
# Hooks run through sh; `|| true` keeps it quiet when no Ghostty is open (pkill exits 1).
post_hook   = 'pkill -SIGUSR2 ghostty || true'

[templates.gtk]
# Nautilus (GTK4/libadwaita) and GTK3 apps (adw-gtk3). Open apps need a restart to pick it up.
input_path  = 'templates/gtk-colors.css'
output_path = ['~/.config/gtk-3.0/gtk.css', '~/.config/gtk-4.0/gtk.css']

[templates.yazi]
# Yazi reads its theme at startup; reopen it to see new colors.
input_path  = 'templates/yazi-theme.toml'
output_path = '~/.config/yazi/theme.toml'

[templates.spicetify]
# Spotify with the Ghost Spicetify theme. Rendered to its own file because Ghost's installer
# replaces the theme's color.ini; the hook merges it in as the [matugen] scheme and selects it.
# Set Ghost's Colours -> Accent to "Theme" to use primary instead of the album art's color.
input_path  = 'templates/spicetify-ghost.ini'
output_path = '~/.local/state/matugen/spicetify-ghost.ini'
post_hook   = 'sh ~/.config/matugen/hooks/spicetify-ghost.sh'

[templates.vesktop]
# Discord in Vesktop: the Ghost plugin reads these (Accent "From matugen", "Colours from matugen").
# Vencord watches its themes folder, so open Vesktop windows update live; no hook needed.
# The discord module's setup turns the theme on in Vencord's settings.
input_path  = 'templates/vesktop-ghost.css'
output_path = '~/.config/vesktop/themes/ghost-matugen.css'

[templates.mangohud]
# MangoHud, the in-game overlay (games started with it on). It reads its config when a game
# starts; Shift_L+F4 reloads it in a running game.
input_path  = 'templates/mangohud.conf'
output_path = '~/.config/MangoHud/MangoHud.conf'

[templates.zed]
# Zed's "Matugen" theme (zed/.config/zed/settings.json picks it). Zed watches its themes folder,
# so open windows recolor live.
input_path  = 'templates/zed-theme.json'
output_path = '~/.config/zed/themes/matugen.json'

[templates.steam]
# Steam with Millennium's Material-Theme (Color: Matugen; the gaming module installs and selects it).
# Rendered to its own file, like Spotify's: the hook copies it into the theme's git checkout.
input_path  = 'templates/steam-material.css'
output_path = '~/.local/state/matugen/steam-material.css'
post_hook   = 'sh ~/.config/matugen/hooks/steam-material.sh'

[templates.zen]
# Zen: rendered to its own file; the hook copies it into the profile (the zen module's setup makes Zen load
# it). Zen reads userChrome.css at startup, so open windows keep their colors until Zen restarts.
input_path  = 'templates/zen-colors.css'
output_path = '~/.local/state/matugen/zen-colors.css'
post_hook   = 'sh ~/.config/matugen/hooks/zen.sh'

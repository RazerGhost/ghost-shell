# Generated by matugen from templates/mangohud.conf. Do not edit; changes are overwritten.
# MangoHud (the in-game overlay): what it shows and how it looks, in the wallpaper's colors.
# Turn it on per game: Steam launch options `mangohud %command%`, or the MangoHud toggle in
# Lutris, Heroic and Faugus. Shift_R+F12 shows or hides it in a game.
# All options: /usr/share/doc/mangohud/MangoHud.conf.example. GOverlay writes this file too;
# change the template instead, or its changes are lost at the next wallpaper change.

### What it shows
fps
frametime
frame_timing
gpu_stats
gpu_temp
cpu_stats
cpu_temp
ram
vram
battery
# Below 30 fps the counter turns the error color, up to 60 the tertiary, above that the primary.
fps_color_change
fps_value=30,60
fps_color={{colors.error.default.hex_stripped}},{{colors.tertiary.default.hex_stripped}},{{colors.primary.default.hex_stripped}}
gpu_load_change
gpu_load_color={{colors.primary.default.hex_stripped}},{{colors.tertiary.default.hex_stripped}},{{colors.error.default.hex_stripped}}
cpu_load_change
cpu_load_color={{colors.primary.default.hex_stripped}},{{colors.tertiary.default.hex_stripped}},{{colors.error.default.hex_stripped}}

### Look: a rounded card like the shell's, top left
position=top-left
offset_x=12
offset_y=12
round_corners=10
background_alpha=0.7
font_size=20
toggle_hud=Shift_R+F12

### Colors
text_color={{colors.on_surface.default.hex_stripped}}
background_color={{colors.surface_container.default.hex_stripped}}
gpu_color={{colors.primary.default.hex_stripped}}
cpu_color={{colors.secondary.default.hex_stripped}}
vram_color={{colors.tertiary.default.hex_stripped}}
ram_color={{colors.tertiary.default.hex_stripped}}
engine_color={{colors.primary.default.hex_stripped}}
io_color={{colors.secondary.default.hex_stripped}}
frametime_color={{colors.primary.default.hex_stripped}}
media_player_color={{colors.on_surface.default.hex_stripped}}
wine_color={{colors.primary.default.hex_stripped}}
battery_color={{colors.secondary.default.hex_stripped}}
network_color={{colors.secondary.default.hex_stripped}}
horizontal_separator_color={{colors.outline_variant.default.hex_stripped}}

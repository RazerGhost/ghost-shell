# Generated by matugen from templates/yazi-theme.toml. Do not edit; changes are overwritten.
# Only overrides colors; everything else falls back to Yazi's default theme.
# Section names are for Yazi 26.x ([mgr], [pick], [cmp]). Color mapping is simplified from
# matugen's official template (github.com/InioX/matugen-themes).

[mgr]
cwd           = { fg = "{{colors.on_surface.default.hex}}" }
find_keyword  = { fg = "{{colors.error.default.hex}}", bold = true }
find_position = { fg = "{{colors.error.default.hex}}" }
border_style  = { fg = "{{colors.outline_variant.default.hex}}" }

marker_selected = { fg = "{{colors.primary.default.hex}}",  bg = "{{colors.primary.default.hex}}" }
marker_copied   = { fg = "{{colors.tertiary.default.hex}}", bg = "{{colors.tertiary.default.hex}}" }
marker_cut      = { fg = "{{colors.error.default.hex}}",    bg = "{{colors.error.default.hex}}" }
marker_marked   = { fg = "{{colors.secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}" }

[tabs]
active   = { fg = "{{colors.on_primary.default.hex}}", bg = "{{colors.primary.default.hex}}", bold = true }
inactive = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_container.default.hex}}" }

[mode]
normal_main = { fg = "{{colors.on_primary.default.hex}}",   bg = "{{colors.primary.default.hex}}",   bold = true }
normal_alt  = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
select_main = { fg = "{{colors.on_secondary.default.hex}}", bg = "{{colors.secondary.default.hex}}", bold = true }
select_alt  = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }
unset_main  = { fg = "{{colors.on_tertiary.default.hex}}",  bg = "{{colors.tertiary.default.hex}}",  bold = true }
unset_alt   = { fg = "{{colors.on_surface_variant.default.hex}}", bg = "{{colors.surface_variant.default.hex}}" }

[status]
progress_label  = { fg = "{{colors.on_surface.default.hex}}", bold = true }
progress_normal = { fg = "{{colors.primary.default.hex}}", bg = "{{colors.surface_container_high.default.hex}}" }
progress_error  = { fg = "{{colors.error.default.hex}}",   bg = "{{colors.surface_container_high.default.hex}}" }

[input]
border = { fg = "{{colors.primary.default.hex}}" }

[pick]
border = { fg = "{{colors.primary.default.hex}}" }
active = { fg = "{{colors.tertiary.default.hex}}", bold = true }

[cmp]
border = { fg = "{{colors.primary.default.hex}}" }

[tasks]
border = { fg = "{{colors.primary.default.hex}}" }

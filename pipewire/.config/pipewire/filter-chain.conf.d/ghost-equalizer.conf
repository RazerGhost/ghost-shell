# The shell's equalizer (Settings -> Sound): five bands between the apps and the speakers or
# headphones. filter-chain.service runs it, apart from PipeWire itself, so restarting it never
# stops other sound. A WirePlumber "smart filter": it's put in front of whichever output is the
# default, without becoming the default itself. The gains start flat; the shell sets them
# (services/Equalizer.qml, with pw-cli) for each output.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Equalizer"
            media.name       = "Equalizer"
            filter.graph = {
                nodes = [
                    { type = builtin name = bass     label = bq_lowshelf  control = { "Freq" = 80.0    "Q" = 0.7 "Gain" = 0.0 } }
                    { type = builtin name = low_mids label = bq_peaking   control = { "Freq" = 250.0   "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = mids     label = bq_peaking   control = { "Freq" = 1000.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = presence label = bq_peaking   control = { "Freq" = 4000.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = treble   label = bq_highshelf control = { "Freq" = 10000.0 "Q" = 0.7 "Gain" = 0.0 } }
                ]
                links = [
                    { output = "bass:Out"     input = "low_mids:In" }
                    { output = "low_mids:Out" input = "mids:In" }
                    { output = "mids:Out"     input = "presence:In" }
                    { output = "presence:Out" input = "treble:In" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name         = "ghost-equalizer"
                media.class       = Audio/Sink
                filter.smart      = true
                filter.smart.name = "ghost-equalizer"
            }
            playback.props = {
                node.name    = "ghost-equalizer.output"
                node.passive = true
            }
        }
    }
]

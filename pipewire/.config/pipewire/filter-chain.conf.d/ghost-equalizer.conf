# The shell's equalizer (Settings -> Sound): five bands between the apps and the speakers or
# headphones. filter-chain.service runs it, apart from PipeWire itself, so restarting it never
# stops other sound. A WirePlumber "smart filter": it's put in front of whichever output is the
# default, without becoming the default itself. The gains start flat; the shell sets them
# (services/Equalizer.qml, with pw-cli) for each output.
# After your five bands, an output's own correction (`sp_*`): the HP Omen 16-xf0's speakers have a
# profile (services/Equalizer.js `outputProfiles`), every other output gets these neutral values
# (the high-pass far below hearing, no gain). One filter rather than a second one for the
# speakers: WirePlumber orders smart filters only among those aimed at the same output, and this
# one follows whichever is the default.
context.modules = [
    { name = libpipewire-module-filter-chain
        args = {
            node.description = "Equalizer"
            media.name       = "Equalizer"
            filter.graph = {
                nodes = [
                    { type = builtin name = bass     label = bq_lowshelf  control = { "Freq" = 80.0    "Q" = 0.7 "Gain" = 0.0 } }
                    { type = builtin name = low_mids label = bq_peaking   control = { "Freq" = 250.0   "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = mids     label = bq_peaking   control = { "Freq" = 1000.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = presence label = bq_peaking   control = { "Freq" = 4000.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = treble   label = bq_highshelf control = { "Freq" = 10000.0 "Q" = 0.7 "Gain" = 0.0 } }
                    { type = builtin name = sp_preamp  label = linear       control = { "Mult" = 1.0 "Add" = 0.0 } }
                    { type = builtin name = sp_rumble  label = bq_highpass  control = { "Freq" = 10.0   "Q" = 0.7 } }
                    { type = builtin name = sp_punch   label = bq_peaking   control = { "Freq" = 110.0  "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = sp_body    label = bq_lowshelf  control = { "Freq" = 200.0  "Q" = 0.7 "Gain" = 0.0 } }
                    { type = builtin name = sp_honk    label = bq_peaking   control = { "Freq" = 1000.0 "Q" = 1.2 "Gain" = 0.0 } }
                    { type = builtin name = sp_clarity label = bq_peaking   control = { "Freq" = 2500.0 "Q" = 1.0 "Gain" = 0.0 } }
                    { type = builtin name = sp_air     label = bq_highshelf control = { "Freq" = 5000.0 "Q" = 0.7 "Gain" = 0.0 } }
                    # Last: a limiter (LSP's, lsp-plugins-lv2) so the profile can be loud without
                    # clipping. Neutral here (no gain, 0 dB ceiling); the speakers' profile gives
                    # back its headroom (`g_in`) under a -1 dB ceiling. No automatic gain boost.
                    { type = lv2 name = sp_limit plugin = "http://lsp-plug.in/plugins/lv2/limiter_mono"
                      control = { "g_in" = 1.0 "th" = 1.0 "boost" = 0 "alr" = 0 "lk" = 5.0 "at" = 5.0 "rt" = 20.0 } }
                ]
                links = [
                    { output = "bass:Out"     input = "low_mids:In" }
                    { output = "low_mids:Out" input = "mids:In" }
                    { output = "mids:Out"     input = "presence:In" }
                    { output = "presence:Out" input = "treble:In" }
                    { output = "treble:Out"     input = "sp_preamp:In" }
                    { output = "sp_preamp:Out"  input = "sp_rumble:In" }
                    { output = "sp_rumble:Out"  input = "sp_punch:In" }
                    { output = "sp_punch:Out"   input = "sp_body:In" }
                    { output = "sp_body:Out"    input = "sp_honk:In" }
                    { output = "sp_honk:Out"    input = "sp_clarity:In" }
                    { output = "sp_clarity:Out" input = "sp_air:In" }
                    { output = "sp_air:Out"     input = "sp_limit:in" }
                ]
            }
            audio.channels = 2
            audio.position = [ FL FR ]
            capture.props = {
                node.name         = "ghost-equalizer"
                media.class       = Audio/Sink
                filter.smart      = true
                filter.smart.name = "ghost-equalizer"
            }
            playback.props = {
                node.name    = "ghost-equalizer.output"
                node.passive = true
            }
        }
    }
]

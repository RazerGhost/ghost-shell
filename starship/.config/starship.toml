# The prompt (Starship, starship.rs), for zsh, fish or bash alike: rounded pills (user's pick
# 2026-11-05; Settings -> Terminal switches to starship/minimal.toml or starship/two-line.toml).
# Colors are the terminal's palette names, not hex: matugen sets Ghostty's palette from the
# wallpaper (templates/ghostty: green = primary, blue = secondary, yellow = tertiary, purple =
# primary_fixed, red = error, black = surface_container_high, used for the text on the pills), so
# the prompt follows the wallpaper without a template of its own.
# Icons are written as escapes ( is a pill's rounded left end,  its right end, 
# the git branch,  a clock, \U000f024b a folder): typed as characters, the private-use ones
# were lost once on the way into this file.
#
#   (󰉋 ~/Projects/ghost-shell) ( main !2) ( 4s)
#   ❯

add_newline = true
format = "$username$hostname$directory$git_branch$git_status$nodejs$python$rust$lua$jobs$sudo$status$cmd_duration$battery$line_break$character"
# The clock on the right (the line you type on only: earlier prompts collapse to ❯, .zshrc).
right_format = "$time"

[directory]
format = "[](fg:green)[\U000f024b $path$read_only](fg:black bg:green bold)[](fg:green) "
truncation_length = 4
truncate_to_repo = false
read_only = " \U000f033e"

# The branch and its changes share one pill: the branch opens it, git_status closes it (git_status
# shows inside every repository, so the pill always gets its end).
[git_branch]
format = "[](fg:blue)[$symbol$branch](fg:black bg:blue)"
symbol = " "

[git_status]
format = "([ $all_status$ahead_behind](fg:black bg:blue))[](fg:blue) "

[cmd_duration]
format = "[](fg:yellow)[ $duration](fg:black bg:yellow)[](fg:yellow) "
min_time = 2000

# A project's language version, in its own pill
[nodejs]
format = "[](fg:purple)[$symbol$version](fg:black bg:purple)[](fg:purple) "

[python]
format = "[](fg:purple)[$symbol$version](fg:black bg:purple)[](fg:purple) "

[rust]
format = "[](fg:purple)[$symbol$version](fg:black bg:purple)[](fg:purple) "

[lua]
format = "[](fg:purple)[$symbol$version](fg:black bg:purple)[](fg:purple) "

# Who and where, only over SSH (or as root): a pill before the folder.
[username]
format = "[\ue0b6](fg:purple)[$user](fg:black bg:purple)"
[hostname]
format = "[@$hostname](fg:black bg:purple)[\ue0b4](fg:purple) "

# Background jobs (Ctrl+Z, &), how many.
[jobs]
format = "[\ue0b6](fg:blue)[\uf013 $number](fg:black bg:blue)[\ue0b4](fg:blue) "
number_threshold = 1

# sudo still unlocked (its password won't be asked for again yet).
[sudo]
disabled = false
format = "[\ue0b6](fg:yellow)[\uf023 sudo](fg:black bg:yellow)[\ue0b4](fg:yellow) "

# The last command failed: its exit code.
[status]
disabled = false
format = "[\ue0b6](fg:red)[\uf00d $status](fg:black bg:red)[\ue0b4](fg:red) "

# The battery only when it's low.
[battery]
format = "[\ue0b6](fg:red)[$symbol$percentage](fg:black bg:red)[\ue0b4](fg:red) "
[[battery.display]]
threshold = 20

[time]
disabled = false
format = "[\uf017 $time](bright-black)"
time_format = "%H:%M"

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
